<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; gap: 12px; padding: 16px; }
  .url-bar { display: flex; gap: 8px; width: 100%; max-width: 860px; }
  .url-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 14px; outline: none; }
  .url-bar input:focus { border-color: #555; }
  .url-bar input::placeholder { color: #555; }
  .url-bar button { padding: 10px 18px; border-radius: 8px; background: #2a2a2a; color: #eee; border: 1px solid #444; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .url-bar button:hover { background: #383838; }
  .player-wrap { background: #000; border-radius: 12px; overflow: hidden; width: 100%; max-width: 860px; box-shadow: 0 8px 40px rgba(0,0,0,0.7); }
  .video-area { position: relative; width: 100%; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  video { width: 100%; height: 100%; display: none; object-fit: contain; }
  .placeholder { color: #444; font-size: 14px; text-align: center; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .placeholder i { font-size: 56px; color: #2a2a2a; }
  .placeholder span { color: #555; }
  .controls { background: linear-gradient(transparent, rgba(0,0,0,0.9)); position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.25s; }
  .video-area:hover .controls, .video-area.paused .controls { opacity: 1; }
  .progress-wrap { position: relative; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; transition: height 0.15s; }
  .progress-wrap:hover { height: 6px; }
  .progress-buf { position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .progress-bar { position: absolute; top: 0; left: 0; height: 100%; background: #fff; border-radius: 2px; }
  .progress-thumb { position: absolute; top: 50%; right: -6px; width: 13px; height: 13px; background: #fff; border-radius: 50%; transform: translateY(-50%); display: none; }
  .progress-wrap:hover .progress-thumb { display: block; }
  .ctrl-row { display: flex; align-items: center; gap: 6px; }
  .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 4px 6px; display: flex; align-items: center; font-size: 20px; opacity: 0.85; line-height: 1; }
  .ctrl-btn:hover { opacity: 1; }
  .time-display { color: rgba(255,255,255,0.7); font-size: 12px; white-space: nowrap; margin-left: 4px; }
  .vol-wrap { display: flex; align-items: center; gap: 6px; }
  .vol-slider { -webkit-appearance: none; appearance: none; width: 70px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); outline: none; cursor: pointer; }
  .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; background: #fff; border-radius: 50%; }
  .spacer { flex: 1; }
  .speed-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; }
  .speed-btn:hover { background: rgba(255,255,255,0.25); }
  .toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.72); color: #fff; font-size: 13px; padding: 6px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* Fullscreen: hide url-bar, show overlay input */
  :fullscreen .fs-url-bar { display: flex !important; }
  :-webkit-full-screen .fs-url-bar { display: flex !important; }
  :fullscreen body > .url-bar { display: none; }

  .fs-url-bar {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    background: linear-gradient(rgba(0,0,0,0.85), transparent);
    gap: 8px;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .video-area:hover .fs-url-bar { opacity: 1; }
  .video-area.paused .fs-url-bar { opacity: 1; }
  .fs-url-bar input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #555; background: rgba(0,0,0,0.7); color: #eee; font-size: 14px; outline: none; }
  .fs-url-bar input:focus { border-color: #888; }
  .fs-url-bar input::placeholder { color: #888; }
  .fs-url-bar button { padding: 8px 16px; border-radius: 8px; background: rgba(50,50,50,0.9); color: #eee; border: 1px solid #555; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .fs-url-bar button:hover { background: rgba(80,80,80,0.9); }
</style>
</head>
<body>

<div class="url-bar" id="topUrlBar">
  <input type="text" id="urlInput" placeholder="Video link paste karanna (mp4, webm...)" />
  <button id="loadBtn"><i class="ti ti-player-play"></i> Load</button>
</div>

<div class="player-wrap" id="playerWrap">
  <div class="video-area paused" id="videoArea">
    <video id="vid" preload="metadata"></video>
    <div class="placeholder" id="placeholder">
      <i class="ti ti-device-tv"></i>
      <span>Link eka enter karanna saha Load click karanna</span>
    </div>
    <div class="toast" id="toast"></div>

    <!-- Fullscreen url bar (only visible in fullscreen) -->
    <div class="fs-url-bar" id="fsUrlBar">
      <input type="text" id="fsUrlInput" placeholder="Video link paste karanna..." />
      <button id="fsLoadBtn"><i class="ti ti-player-play"></i> Load</button>
    </div>

    <div class="controls">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-buf" id="progressBuf"></div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-thumb"></div>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="playBtn" aria-label="Play/Pause"><i class="ti ti-player-play" id="playIcon"></i></button>
        <button class="ctrl-btn" id="skipBack" aria-label="-10s"><i class="ti ti-rotate-clockwise-2" style="transform:scaleX(-1)"></i></button>
        <button class="ctrl-btn" id="skipFwd" aria-label="+10s"><i class="ti ti-rotate-clockwise-2"></i></button>
        <div class="vol-wrap">
          <button class="ctrl-btn" id="muteBtn" aria-label="Mute"><i class="ti ti-volume" id="volIcon"></i></button>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" />
        </div>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <div class="spacer"></div>
        <button class="speed-btn" id="speedBtn">1×</button>
        <button class="ctrl-btn" id="pipBtn" aria-label="Picture in Picture"><i class="ti ti-picture-in-picture"></i></button>
        <button class="ctrl-btn" id="fsBtn" aria-label="Fullscreen"><i class="ti ti-maximize" id="fsIcon"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
  const vid = document.getElementById('vid');
  const videoArea = document.getElementById('videoArea');
  const placeholder = document.getElementById('placeholder');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const skipBack = document.getElementById('skipBack');
  const skipFwd = document.getElementById('skipFwd');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const volSlider = document.getElementById('volSlider');
  const timeDisplay = document.getElementById('timeDisplay');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressBuf = document.getElementById('progressBuf');
  const speedBtn = document.getElementById('speedBtn');
  const pipBtn = document.getElementById('pipBtn');
  const fsBtn = document.getElementById('fsBtn');
  const fsIcon = document.getElementById('fsIcon');
  const urlInput = document.getElementById('urlInput');
  const loadBtn = document.getElementById('loadBtn');
  const fsUrlInput = document.getElementById('fsUrlInput');
  const fsLoadBtn = document.getElementById('fsLoadBtn');
  const toast = document.getElementById('toast');
  const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
  let speedIdx = 2, toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
  }

  function fmt(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function loadVideo(url) {
    url = url || urlInput.value.trim();
    if (!url) return;
    urlInput.value = url;
    fsUrlInput.value = url;
    vid.src = url;
    placeholder.style.display = 'none';
    vid.style.display = 'block';
    vid.load();
    vid.play().catch(() => {});
  }

  loadBtn.onclick = () => loadVideo(urlInput.value.trim());
  urlInput.onkeydown = e => { if (e.key === 'Enter') loadVideo(urlInput.value.trim()); };

  fsLoadBtn.onclick = () => loadVideo(fsUrlInput.value.trim());
  fsUrlInput.onkeydown = e => { if (e.key === 'Enter') loadVideo(fsUrlInput.value.trim()); };

  vid.addEventListener('play', () => { playIcon.className = 'ti ti-player-pause'; videoArea.classList.remove('paused'); });
  vid.addEventListener('pause', () => { playIcon.className = 'ti ti-player-play'; videoArea.classList.add('paused'); });
  vid.addEventListener('ended', () => videoArea.classList.add('paused'));

  playBtn.onclick = () => { vid.paused ? vid.play() : vid.pause(); };
  videoArea.addEventListener('click', e => {
    if (e.target === vid) { vid.paused ? vid.play() : vid.pause(); }
  });

  skipBack.onclick = () => { vid.currentTime = Math.max(0, vid.currentTime - 10); showToast('-10s'); };
  skipFwd.onclick = () => { vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); showToast('+10s'); };

  vid.ontimeupdate = () => {
    if (!vid.duration) return;
    progressBar.style.width = (vid.currentTime / vid.duration * 100) + '%';
    timeDisplay.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
  };

  vid.onprogress = () => {
    if (vid.buffered.length && vid.duration)
      progressBuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
  };

  progressWrap.addEventListener('click', e => {
    const r = progressWrap.getBoundingClientRect();
    vid.currentTime = ((e.clientX - r.left) / r.width) * (vid.duration || 0);
  });

  muteBtn.onclick = () => { vid.muted = !vid.muted; volIcon.className = vid.muted ? 'ti ti-volume-off' : 'ti ti-volume'; };
  volSlider.oninput = () => { vid.volume = volSlider.value; vid.muted = false; volIcon.className = 'ti ti-volume'; };

  speedBtn.onclick = () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    vid.playbackRate = speeds[speedIdx];
    speedBtn.textContent = speeds[speedIdx] + '×';
    showToast(speeds[speedIdx] + '× speed');
  };

  pipBtn.onclick = async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await vid.requestPictureInPicture();
    } catch(e) { showToast('PiP not supported'); }
  };

  fsBtn.onclick = () => {
    const el = document.getElementById('playerWrap');
    if (!document.fullscreenElement) {
      el.requestFullscreen();
      fsIcon.className = 'ti ti-minimize';
    } else {
      document.exitFullscreen();
      fsIcon.className = 'ti ti-maximize';
    }
  };

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) fsIcon.className = 'ti ti-maximize';
  });

  document.addEventListener('keydown', e => {
    const active = document.activeElement;
    if (active === urlInput || active === fsUrlInput) return;
    if (e.code === 'Space') { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    if (e.code === 'ArrowLeft') { vid.currentTime -= 10; showToast('-10s'); }
    if (e.code === 'ArrowRight') { vid.currentTime += 10; showToast('+10s'); }
    if (e.code === 'ArrowUp') { vid.volume = Math.min(1, vid.volume + 0.1); volSlider.value = vid.volume; showToast('Vol ' + Math.round(vid.volume * 100) + '%'); }
    if (e.code === 'ArrowDown') { vid.volume = Math.max(0, vid.volume - 0.1); volSlider.value = vid.volume; showToast('Vol ' + Math.round(vid.volume * 100) + '%'); }
    if (e.code === 'KeyM') { vid.muted = !vid.muted; volIcon.className = vid.muted ? 'ti ti-volume-off' : 'ti ti-volume'; }
    if (e.code === 'KeyF') fsBtn.click();
  });
</script>
</body>
</html>
