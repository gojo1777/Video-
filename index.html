<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
  }

  .video-wrap {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  /* URL BAR - overlay on top of video, hidden by default */
  .url-bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: linear-gradient(rgba(0,0,0,0.85), transparent);
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .url-bar.visible {
    opacity: 1;
    pointer-events: all;
  }
  .url-bar input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: #eee;
    font-size: 14px;
    outline: none;
    min-width: 0;
  }
  .url-bar input::placeholder { color: #555; }
  .url-bar input:focus { border-color: #555; }
  .url-bar button {
    padding: 10px 14px;
    border-radius: 8px;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .url-bar button:active { background: #444; }

  /* VIDEO AREA - fills remaining space */
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: #555;
    font-size: 14px;
    text-align: center;
    padding: 2rem;
  }
  .placeholder i { font-size: 52px; color: #2a2a2a; }

  /* CONTROLS OVERLAY */
  .controls-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: linear-gradient(transparent 40%, rgba(0,0,0,0.85));
    opacity: 0;
    transition: opacity 0.25s;
  }
  .controls-overlay.visible { opacity: 1; }

  /* Center play button */
  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
  }

  .bottom-controls {
    padding: 8px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Progress bar */
  .progress-wrap {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    cursor: pointer;
    touch-action: none;
  }
  .progress-buf { position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.2); border-radius: 2px; }
  .progress-bar { position: absolute; top: 0; left: 0; height: 100%; background: #fff; border-radius: 2px; }
  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    margin-left: 0;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    font-size: 22px;
    opacity: 0.9;
    line-height: 1;
    flex-shrink: 0;
  }
  .ctrl-btn:active { opacity: 0.6; }

  .time-display {
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    white-space: nowrap;
    margin: 0 4px;
  }
  .spacer { flex: 1; }

  .speed-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .speed-btn:active { background: rgba(255,255,255,0.3); }

  /* Volume row - hidden on mobile by default (use device volume) */
  .vol-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 60px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.3);
    outline: none;
    cursor: pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
  }
  .toast.show { opacity: 1; }

  /* Fullscreen tweaks */
  :fullscreen #app { height: 100vh; height: 100dvh; }
  :-webkit-full-screen #app { height: 100vh; }
</style>
</head>
<body>
<div id="app">
  <div class="video-wrap" id="videoWrap">
    <div class="url-bar" id="urlBar">
      <input type="text" id="urlInput" placeholder="Video link paste karanna..." autocomplete="off" />
      <button id="loadBtn"><i class="ti ti-player-play"></i> Load</button>
    </div>
    <video id="vid" preload="metadata" playsinline webkit-playsinline></video>

    <div class="placeholder" id="placeholder">
      <i class="ti ti-device-tv"></i>
      <span>Link eka enter kara Load click karanna</span>
    </div>

    <div class="controls-overlay" id="overlay">
      <button class="center-btn" id="centerBtn"><i class="ti ti-player-play" id="centerIcon"></i></button>

      <div class="bottom-controls">
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-buf" id="progressBuf"></div>
          <div class="progress-bar" id="progressBar" style="width:0%"></div>
          <div class="progress-thumb" id="progressThumb" style="left:0%"></div>
        </div>

        <div class="ctrl-row">
          <button class="ctrl-btn" id="playBtn"><i class="ti ti-player-play" id="playIcon"></i></button>
          <button class="ctrl-btn" id="skipBack"><i class="ti ti-rotate-clockwise-2" style="transform:scaleX(-1)"></i></button>
          <button class="ctrl-btn" id="skipFwd"><i class="ti ti-rotate-clockwise-2"></i></button>
          <div class="vol-wrap">
            <button class="ctrl-btn" id="muteBtn"><i class="ti ti-volume" id="volIcon"></i></button>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" />
          </div>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          <div class="spacer"></div>
          <button class="speed-btn" id="speedBtn">1×</button>
          <button class="ctrl-btn" id="fsBtn"><i class="ti ti-maximize" id="fsIcon"></i></button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
  const vid = document.getElementById('vid');
  const overlay = document.getElementById('overlay');
  const placeholder = document.getElementById('placeholder');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const centerBtn = document.getElementById('centerBtn');
  const centerIcon = document.getElementById('centerIcon');
  const skipBack = document.getElementById('skipBack');
  const skipFwd = document.getElementById('skipFwd');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const volSlider = document.getElementById('volSlider');
  const timeDisplay = document.getElementById('timeDisplay');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressBuf = document.getElementById('progressBuf');
  const progressThumb = document.getElementById('progressThumb');
  const speedBtn = document.getElementById('speedBtn');
  const fsBtn = document.getElementById('fsBtn');
  const fsIcon = document.getElementById('fsIcon');
  const urlInput = document.getElementById('urlInput');
  const loadBtn = document.getElementById('loadBtn');
  const toast = document.getElementById('toast');
  const app = document.getElementById('app');

  const urlBar = document.getElementById('urlBar');
  let speedIdx = 2, toastTimer, hideTimer, loaded = false;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
  }

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function showControls() {
    overlay.classList.add('visible');
    urlBar.classList.add('visible');
    clearTimeout(hideTimer);
    if (!vid.paused) hideTimer = setTimeout(() => {
      overlay.classList.remove('visible');
      urlBar.classList.remove('visible');
    }, 3000);
  }

  document.getElementById('videoWrap').addEventListener('click', e => {
    if (!loaded) return;
    if (e.target === vid || e.target === document.getElementById('videoWrap')) {
      if (overlay.classList.contains('visible') && !vid.paused) {
        vid.paused ? vid.play() : vid.pause();
      } else {
        showControls();
      }
    }
  });

  document.getElementById('videoWrap').addEventListener('touchstart', () => { if (loaded) showControls(); }, { passive: true });

  function loadVideo() {
    const url = urlInput.value.trim();
    if (!url) return;
    vid.src = url;
    placeholder.style.display = 'none';
    vid.style.display = 'block';
    loaded = true;
    vid.load();
    vid.play().catch(() => {});
    showControls();
  }

  // show controls initially so user sees the url bar
  urlBar.classList.add('visible');
  overlay.classList.add('visible');
  document.getElementById('loadBtn').onclick = loadVideo;
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { urlInput.blur(); loadVideo(); } });

  vid.addEventListener('play', () => {
    playIcon.className = 'ti ti-player-pause';
    centerIcon.className = 'ti ti-player-pause';
    hideTimer = setTimeout(() => overlay.classList.remove('visible'), 3000);
  });
  vid.addEventListener('pause', () => {
    playIcon.className = 'ti ti-player-play';
    centerIcon.className = 'ti ti-player-play';
    overlay.classList.add('visible');
    urlBar.classList.add('visible');
    clearTimeout(hideTimer);
  });
  vid.addEventListener('ended', () => {
    playIcon.className = 'ti ti-player-play';
    centerIcon.className = 'ti ti-player-play';
    overlay.classList.add('visible');
    urlBar.classList.add('visible');
  });

  playBtn.onclick = centerBtn.onclick = (e) => {
    e.stopPropagation();
    vid.paused ? vid.play() : vid.pause();
    showControls();
  };

  skipBack.onclick = (e) => { e.stopPropagation(); vid.currentTime = Math.max(0, vid.currentTime - 10); showToast('-10s'); showControls(); };
  skipFwd.onclick = (e) => { e.stopPropagation(); vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); showToast('+10s'); showControls(); };

  vid.ontimeupdate = () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    progressBar.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeDisplay.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
  };
  vid.onprogress = () => {
    if (vid.buffered.length && vid.duration)
      progressBuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
  };

  function seekTo(e) {
    const r = progressWrap.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    vid.currentTime = Math.max(0, Math.min(1, x / r.width)) * (vid.duration || 0);
  }
  progressWrap.addEventListener('click', e => { e.stopPropagation(); seekTo(e); showControls(); });
  progressWrap.addEventListener('touchmove', e => { e.preventDefault(); seekTo(e); showControls(); }, { passive: false });

  muteBtn.onclick = (e) => { e.stopPropagation(); vid.muted = !vid.muted; volIcon.className = vid.muted ? 'ti ti-volume-off' : 'ti ti-volume'; showControls(); };
  volSlider.oninput = () => { vid.volume = volSlider.value; vid.muted = false; volIcon.className = 'ti ti-volume'; };
  volSlider.addEventListener('click', e => e.stopPropagation());

  speedBtn.onclick = (e) => {
    e.stopPropagation();
    speedIdx = (speedIdx + 1) % speeds.length;
    vid.playbackRate = speeds[speedIdx];
    speedBtn.textContent = speeds[speedIdx] + '×';
    showToast(speeds[speedIdx] + '× speed');
    showControls();
  };

  fsBtn.onclick = (e) => {
    e.stopPropagation();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = app;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      fsIcon.className = 'ti ti-minimize';
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      fsIcon.className = 'ti ti-maximize';
    }
    showControls();
  };

  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) fsIcon.className = 'ti ti-maximize'; });
  document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement) fsIcon.className = 'ti ti-maximize'; });

  document.addEventListener('keydown', e => {
    if (e.target === urlInput) return;
    if (e.code === 'Space') { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    if (e.code === 'ArrowLeft') { vid.currentTime -= 10; showToast('-10s'); }
    if (e.code === 'ArrowRight') { vid.currentTime += 10; showToast('+10s'); }
    if (e.code === 'KeyM') { vid.muted = !vid.muted; volIcon.className = vid.muted ? 'ti ti-volume-off' : 'ti ti-volume'; }
    if (e.code === 'KeyF') fsBtn.click();
  });
</script>
</body>
</html>
